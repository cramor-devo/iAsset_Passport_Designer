# Test bij elke push/PR; op main: nieuwe versie bouwen (Windows-exe) en automatisch als release publiceren.
# Test on every push/PR; on main: build a new version (Windows exe) and publish it as a release automatically.
name: CI and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pyright
      - run: pytest

  release:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        id: version
        shell: bash
        run: |
          version=$(python -c "import passport_designer as p; print(p.__version__)")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build executable
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: ./build.ps1
      - name: Release notes
        if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - "${{ steps.version.outputs.tag }}" > notes.md <<'EOF'
          import sys
          version = sys.argv[1].lstrip("v")
          lines, keep = [], False
          for line in open("CHANGELOG.md", encoding="utf-8"):
              if line.startswith("## "):
                  keep = line[3:].strip() == version
                  continue
              if keep:
                  lines.append(line.rstrip("\n"))
          print("\n".join(lines).strip() or f"iAsset Passport Designer {version}")
          EOF
      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" dist/iAsset_Passport_Designer.exe \
            --target "${{ github.sha }}" --title "iAsset Passport Designer ${tag#v}" --notes-file notes.md
