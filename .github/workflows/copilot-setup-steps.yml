name: Copilot setup steps

# NL: Bereidt de omgeving van de Copilot cloud agent voor (Ubuntu): Python, Qt-systeembibliotheken en de
#     dev-dependencies in .venv, zodat de agent direct ruff, pyright en pytest kan draaien. Draait ook bij
#     wijzigingen aan dit bestand, zodat je kunt zien of de set-up werkt.
# EN: Prepares the Copilot cloud agent's environment (Ubuntu): Python, Qt system libraries and the dev
#     dependencies in .venv, so the agent can run ruff, pyright and pytest straight away. Also runs when this
#     file changes, so you can see whether the set-up works.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # NL: De job moet 'copilot-setup-steps' heten, anders gebruikt Copilot hem niet.
  # EN: The job must be called 'copilot-setup-steps', otherwise Copilot does not use it.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      # NL: PyQt6 levert Qt mee, maar heeft deze systeembibliotheken nodig (ook voor het offscreen-platform).
      # EN: PyQt6 ships Qt itself, but needs these system libraries (also for the offscreen platform).
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies in .venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      # NL: Snelle controle dat Qt offscreen werkt; de agent draait zelf de volledige controles.
      # EN: Quick check that Qt works offscreen; the agent runs the full checks itself.
      - name: Smoke test
        run: .venv/bin/python -m pytest -q
