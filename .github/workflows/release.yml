name: Release

# NL: Bouwt de Windows-exe in de cloud zodra een release wordt gepubliceerd en hangt de exe en een SHA256-bestand
#     aan die release. PyInstaller kan niet cross-compileren, dus de build draait op windows-latest.
#     Handmatig starten (workflow_dispatch) met een tag bouwt de exe opnieuw en vervangt de bestanden in die release.
# EN: Builds the Windows exe in the cloud as soon as a release is published and attaches the exe and a SHA256 file
#     to that release. PyInstaller cannot cross-compile, so the build runs on windows-latest.
#     Running it manually (workflow_dispatch) with a tag rebuilds the exe and replaces the files in that release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z) / Release-tag (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      # NL: De tag moet overeenkomen met __version__ in passport_designer/__init__.py.
      # EN: The tag must match __version__ in passport_designer/__init__.py.
      - name: Check version
        shell: pwsh
        run: |
          $match = Select-String -Path passport_designer/__init__.py -Pattern '^__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"'
          if (-not $match) { throw "__version__ not found" }
          $version = $match.Matches[0].Groups[1].Value
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match __version__ $version" }
          Write-Host "Version $version"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # NL: Eerst de controles; bij een fout wordt er geen exe gepubliceerd.
      # EN: Checks first; if anything fails, no exe is published.
      #     Aparte stappen, zodat elke fout de job stopt. / Separate steps, so every failure stops the job.
      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Build exe
        shell: pwsh
        run: ./build.ps1

      - name: Write SHA256
        shell: pwsh
        run: |
          $exe = "dist/iAsset_Passport_Designer.exe"
          if (-not (Test-Path $exe)) { throw "$exe not found" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  iAsset_Passport_Designer.exe" | Out-File -Encoding ascii -NoNewline "$exe.sha256"
          Write-Host "SHA256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iAsset_Passport_Designer-${{ env.TAG }}-win64
          path: |
            dist/iAsset_Passport_Designer.exe
            dist/iAsset_Passport_Designer.exe.sha256

      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:TAG dist/iAsset_Passport_Designer.exe dist/iAsset_Passport_Designer.exe.sha256 `
            --clobber --repo $env:GITHUB_REPOSITORY
